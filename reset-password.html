<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | NextGen Travel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
    <!-- Inline styles for dark auth card layout -->
    <style>
        .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #000; padding: 2rem; }
        .auth-card { background: #111; border: 1px solid #222; padding: 3rem; width: 100%; max-width: 420px; }
        .auth-card input { background: transparent; border: 1px solid #333; color: white; border-radius: 0; padding: 0.75rem 1rem; }
        .auth-card input:focus { border-color: #d4a373; box-shadow: none; }
        .auth-card .btn-submit { background: #d4a373; color: #000; border: none; border-radius: 0; padding: 0.75rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; font-size: 0.8rem; width: 100%; }
        .auth-card .btn-submit:hover { opacity: 0.85; }
        .alert-msg { display: none; padding: 0.75rem 1rem; margin-bottom: 1rem; font-size: 0.85rem; border-radius: 0; }
    </style>
</head>
<body>
    <!-- ==================== RESET PASSWORD PAGE ==================== -->
    <div class="auth-page">
        <div class="auth-card">
            <div class="text-center mb-4">
                <h2 class="serif text-white fs-3 mb-1">NextGen</h2>
                <p class="small opacity-50">Enter your new password</p>
            </div>
            <!-- Alert message container (hidden until triggered) -->
            <div id="alert-msg" class="alert-msg"></div>
            <form id="reset-form">
                <div class="mb-3">
                    <label class="small tracking-widest mb-2 opacity-50">New Password</label>
                    <input type="password" id="password" placeholder="Min. 6 characters" minlength="6" required>
                </div>
                <div class="mb-4">
                    <label class="small tracking-widest mb-2 opacity-50">Confirm Password</label>
                    <input type="password" id="confirm" placeholder="Repeat password" required>
                </div>
                <button type="submit" class="btn-submit" id="submit-btn">Reset Password</button>
            </form>
            <div class="text-center mt-3">
                <a href="index.html" class="small opacity-50 text-white text-decoration-none">← Back to Login</a>
            </div>
        </div>
    </div>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
<script src="js/api.js"></script>
    <script>
        let recoveredSession = false;

        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (event === 'PASSWORD_RECOVERY') {
                recoveredSession = true;
            }
        });

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;
            const alertEl = document.getElementById('alert-msg');
            const btn = document.getElementById('submit-btn');

            if (password !== confirm) {
                alertEl.className = 'alert-msg'; alertEl.style.display = 'block';
                alertEl.style.background = 'rgba(239,68,68,0.1)'; alertEl.style.color = '#ef4444';
                alertEl.textContent = 'Passwords do not match';
                return;
            }

            btn.disabled = true; btn.textContent = 'Resetting...';
            try {
                if (!recoveredSession) {
                    const hash = window.location.hash;
                    if (hash && hash.includes('access_token')) {
                        const { error: sessionErr } = await supabaseClient.auth.setSession({
                            access_token: new URLSearchParams(hash.slice(1)).get('access_token'),
                            refresh_token: new URLSearchParams(hash.slice(1)).get('refresh_token')
                        });
                        if (sessionErr) throw sessionErr;
                    } else {
                        throw new Error('Invalid or expired reset link. Please request a new one.');
                    }
                }
                const { error } = await supabaseClient.auth.updateUser({ password });
                if (error) throw error;
                alertEl.className = 'alert-msg'; alertEl.style.display = 'block';
                alertEl.style.background = 'rgba(34,197,94,0.1)'; alertEl.style.color = '#22c55e';
                alertEl.innerHTML = 'Password reset successfully! <a href="index.html" style="color:white;">Login here</a>';
                document.getElementById('reset-form').reset();
            } catch (err) {
                alertEl.className = 'alert-msg'; alertEl.style.display = 'block';
                alertEl.style.background = 'rgba(239,68,68,0.1)'; alertEl.style.color = '#ef4444';
                alertEl.textContent = err.message;
            }
            btn.disabled = false; btn.textContent = 'Reset Password';
        });
    </script>
</body>
</html>
